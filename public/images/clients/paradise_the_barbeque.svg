<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <!-- Barbecue Flame & Grill Emblem -->
  <g transform="translate(300, 150)">
    <!-- Outer Glow / Ambient Flame Petals -->
    <path d="M-60,50 C-90,10 -70,-40 -30,-90 C-10,-50 10,-30 0,-10 C20,-40 40,-80 70,-70 C90,-30 80,20 60,50 C30,85 -30,85 -60,50 Z" fill="#ff4d00" opacity="0.15" />
    
    <!-- Dynamic Flame -->
    <path d="M-45,45 C-75,10 -55,-35 -20,-75 C-5,-45 15,-25 5,-5 C25,-30 45,-60 65,-50 C80,-15 70,25 45,45 C20,70 -20,70 -45,45 Z" fill="url(#flameGrad)" />

    <!-- Barbecue Fork Crossed Over Flame -->
    <g transform="rotate(-30) translate(-5, -20)">
      <!-- Fork Tines -->
      <path d="M-14,-50 L-14,-20 C-14,-5 -6,5 0,8 C6,5 14,-5 14,-20 L14,-50 C14,-52 11,-54 9,-54 C7,-54 5,-52 5,-48 L5,-22 C5,-14 2,-8 0,-8 C-2,-8 -5,-14 -5,-22 L-5,-48 C-5,-52 -7,-54 -9,-54 C-11,-54 -14,-52 -14,-50 Z" fill="#ffffff" />
      <!-- Center tine -->
      <path d="M-2,-56 L2,-56 L2,-20 L-2,-20 Z" fill="#ffffff" />
      <!-- Fork Handle -->
      <path d="M-4,8 L4,8 L5,70 L-5,70 Z" fill="#ffffff" />
      <path d="M-6,70 L6,70 L7,100 L-7,100 Z" fill="#ff4d00" rx="3" />
    </g>

    <!-- Grill Sizzle Sparks -->
    <circle cx="-55" cy="-20" r="3" fill="#ff9900" />
    <circle cx="50" cy="-35" r="3.5" fill="#ffbb00" />
    <circle cx="-25" cy="-85" r="2.5" fill="#ff4d00" />
    <circle cx="20" cy="-70" r="2.5" fill="#ffbb00" />
  </g>

  <!-- Typography -->
  <!-- "PARADISE" -->
  <text x="300" y="300" text-anchor="middle" font-family="'Instrument Serif', 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="0.18em" fill="#141414">
    PARADISE
  </text>

  <!-- Subtitle Divider Lines -->
  <line x1="80" y1="335" x2="170" y2="335" stroke="#ff4d00" stroke-width="2" stroke-linecap="round" />
  <circle cx="178" cy="335" r="3" fill="#ff4d00" />
  
  <text x="300" y="340" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="15" font-weight="800" letter-spacing="0.32em" fill="#ff4d00">
    THE BARBEQUE
  </text>

  <circle cx="422" cy="335" r="3" fill="#ff4d00" />
  <line x1="430" y1="335" x2="520" y2="335" stroke="#ff4d00" stroke-width="2" stroke-linecap="round" />

  <!-- Tagline / Location -->
  <text x="300" y="375" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="0.25em" fill="#78716c">
    KOREAN STONE GRILL &amp; BUFFET
  </text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
</svg>
